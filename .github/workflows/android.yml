name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Gradle 8.10.2 працює на JDK 8–23. 17 — мінімум для AGP 8; 21 — JDK, вбудований в Android Studio.
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Lint інформаційний: не блокує збірку, звіт доступний як артефакт.
      - name: Android Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-jdk${{ matrix.java }}
          path: app/build/outputs/apk/debug/app-debug.apk
